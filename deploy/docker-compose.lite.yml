# XimoAi 轻量部署 (仅 Docker 运行 PostgreSQL + Redis，XimoAi 直接运行二进制)
# 适用于低内存服务器 (1GB 以下)

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ximoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ximoai123}
      POSTGRES_DB: ${POSTGRES_DB:-ximoai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ximoai}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
